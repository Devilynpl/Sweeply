<!-- From Uiverse.io by reglobby -->
<div class="toggle-row">
    <!-- Poland Flag SVG -->
    <div class="flag-icon pl-flag">
        <svg viewBox="0 0 30 20">
            <rect width="30" height="10" fill="#fff"/>
            <rect width="30" height="10" y="10" fill="#dc143c"/>
        </svg>
    </div>

    <div class="toggle-container">
        <div class="toggle-wrap">
            <input class="toggle-input" id="holo-toggle" type="checkbox" />
            <label class="toggle-track" for="holo-toggle">
                <div class="track-lines">
                    <div class="track-line"></div>
                </div>

                <div class="toggle-thumb">
                    <div class="thumb-core"></div>
                    <div class="thumb-inner"></div>
                    <div class="thumb-reflection"></div>
                    <div class="thumb-scan"></div>
                    <div class="thumb-particles">
                        <div class="thumb-particle"></div>
                        <div class="thumb-particle"></div>
                        <div class="thumb-particle"></div>
                        <div class="thumb-particle"></div>
                        <div class="thumb-particle"></div>
                    </div>
                </div>

                <div class="toggle-data">
                    <div class="data-text off">ENG</div>
                    <div class="data-text on">PL</div>
                    <div class="status-indicator off"></div>
                    <div class="status-indicator on"></div>
                </div>

                <div class="energy-rings">
                    <div class="energy-ring"></div>
                    <div class="energy-ring"></div>
                    <div class="energy-ring"></div>
                </div>

                <div class="interface-lines">
                    <div class="interface-line"></div>
                    <div class="interface-line"></div>
                    <div class="interface-line"></div>
                    <div class="interface-line"></div>
                    <div class="interface-line"></div>
                    <div class="interface-line"></div>
                </div>

                <div class="toggle-reflection"></div>
                <div class="holo-glow"></div>
            </label>
        </div>
    </div>

    <!-- UK Flag SVG -->
    <div class="flag-icon uk-flag">
        <svg viewBox="0 0 60 30">
            <rect width="60" height="30" fill="#012169"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>
            <path d="M30,0 L30,30 M0,15 L60,15" stroke="#fff" stroke-width="10"/>
            <path d="M30,0 L30,30 M0,15 L60,15" stroke="#C8102E" stroke-width="6"/>
        </svg>
    </div>
</div>
